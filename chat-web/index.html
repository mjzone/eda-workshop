<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost Passport and NIC Finder</title>
  <style>
    :root { --ink: #14233d; --muted: #5e6b7e; --paper: #f5f4ee; --card: #fcfbf7; --line: #d8d9cf; --accent: #e3ae4a; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
    h1 { margin: 0; font-size: 24px; }
    p.hint { margin: 0; color: var(--muted); }
    #log { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
    .you { align-self: flex-end; background: var(--ink); color: #fff; }
    .agent { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
    .flag { font-size: 12px; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #error { color: #a3261b; }
  </style>
</head>
<body>
  <main>
    <h1>Lost Passport and NIC Finder</h1>
    <p class="hint">Ask whether your passport or NIC has been handed in to the security desk. Messages are checked by Bedrock Guardrails.</p>
    <div id="log" aria-live="polite"></div>
    <p id="error" role="alert"></p>
    <form id="form">
      <label for="message" class="hint" hidden>Message</label>
      <input id="message" autocomplete="off" maxlength="1000" placeholder="Type your message" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <!-- config.js is written by `npm run chat:web` -->
  <script src="config.js"></script>
  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('message');
    const send = document.getElementById('send');
    const error = document.getElementById('error');
    const sessionId = crypto.randomUUID();

    function add(text, who, flagged) {
      const div = document.createElement('div');
      div.className = `msg ${who}`;
      div.textContent = text;
      if (flagged) {
        const flag = document.createElement('div');
        flag.className = 'flag';
        flag.textContent = 'checked by the guardrail';
        div.appendChild(flag);
      }
      log.appendChild(div);
      div.scrollIntoView({ block: 'end' });
    }

    if (!window.CHAT_CONFIG) {
      error.textContent = 'No config.js found. Run "npm run chat:web" in the project folder, then reload this page.';
      send.disabled = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add(message, 'you');
      input.value = '';
      send.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch(window.CHAT_CONFIG.apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': window.CHAT_CONFIG.apiKey },
          body: JSON.stringify({ session_id: sessionId, message }),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.message || body.error || `HTTP ${response.status}`);
        add(body.reply, 'agent', body.guardrail_intervened);
      } catch (e) {
        error.textContent = `Couldn't reach the chat API: ${e.message}`;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
